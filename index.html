<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nam Tran</title>
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      background-image: url("./public/background-full.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .figure {
      position: absolute;
      left: 41.5%;
      bottom: -3.5%;
      height: 68vh;
      width: auto;
      z-index: 2;

      transform: translateX(-50%);
      transform-origin: bottom center;
    }
  </style>

  <link rel="stylesheet" href="./css/ambient-stars.css" />
  <link rel="stylesheet" href="./css/constellation-interaction.css" />
  <link rel="stylesheet" href="./css/constellation-quote.css" />

  <link rel="stylesheet" href="./css/figure-stardust.css" />

  <link rel="stylesheet" href="./css/figure-butterflies.css" />

</head>

<body>
  <main class="landing">
    <div class="constellation-dim"></div>
    <div class="starlight-wash"></div>
    <div class="constellation-quote" aria-label="life is not about finding yourself. life is about creating yourself. — george bernard shaw">
      <span class="quote-line quote-line-one"></span>
      <span class="quote-line quote-line-two"></span><span class="quote-cursor" aria-hidden="true"></span>
    </div>
    <div class="foot-shadow"></div>
    <div class="figure-stardust" aria-hidden="true"></div>
    <div class="figure-butterflies" aria-hidden="true"></div>

    <img
      class="figure"
      src="./public/nam-standing.png"
      alt="Nam standing on the balcony"
    />
  </main>

  <script src="./js/portfolio-stars.js"></script>
  <script src="./js/static-star-labels.js"></script>
  <script src="./js/constellation-interaction.js"></script>
  <script src="./js/ambient-stars.js"></script>
  <script src="./js/constellation-quote.js"></script>

  <script src="./js/figure-stardust.js"></script>

  <script src="./js/figure-butterflies.js"></script>

</body>
</html>
