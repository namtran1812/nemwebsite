<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nam Tran</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;

      background-image: url("./public/background-full.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .figure {
      --float-distance: 4px;
      --sway-angle: 0.25deg;
      --movement-duration: 5s;

      position: absolute;
      left: 41.5%;
      bottom: -3.5%;
      height: 68vh;
      width: auto;

      z-index: 2;

      transform-origin: bottom center;
      animation: namMove var(--movement-duration) ease-in-out infinite;
      will-change: transform;
    }

    .foot-shadow {
      position: absolute;

      left: 38.5%;
      bottom: 0.5%;

      width: 190px;
      height: 18px;

      background: rgba(0, 0, 0, 0.72);
      border-radius: 50%;
      filter: blur(9px);

      transform: rotate(-5deg);
      transform-origin: right center;

      z-index: 1;
      pointer-events: none;
    }

    @keyframes namMove {
      0%,
      100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(calc(-1 * var(--sway-angle)));
      }

      50% {
        transform:
          translateX(-50%)
          translateY(calc(-1 * var(--float-distance)))
          rotate(var(--sway-angle));
      }
    }
  </style>
</head>

<body>
  <main class="landing">
    <div class="foot-shadow"></div>

    <img
      class="figure"
      src="./public/nam-standing.png"
      alt="Nam standing on the balcony"
    />
  </main>
</body>
</html>
