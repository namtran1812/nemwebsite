<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nam Tran</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      background-image: url("./public/background-full.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .figure {
      position: absolute;
      left: 41.5%;
      bottom: -3.5%;
      height: 68vh;
      width: auto;
      z-index: 2;

      transform: translateX(-50%);
      transform-origin: bottom center;
    }
  </style>

  <link rel="stylesheet" href="./css/ambient-stars.css" />
  <link rel="stylesheet" href="./css/constellation-interaction.css" />
</head>

<body>
  <main class="landing">
    <div class="constellation-dim"></div>
    <div class="starlight-wash"></div>
    <div class="foot-shadow"></div>

    <img
      class="figure"
      src="./public/nam-standing.png"
      alt="Nam standing on the balcony"
    />
  </main>

  <script src="./js/portfolio-stars.js"></script>
  <script src="./js/static-star-labels.js"></script>
  <script src="./js/constellation-interaction.js"></script>
  <script src="./js/ambient-stars.js"></script>
</body>
</html>
