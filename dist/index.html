<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nam Tran</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      background-image: url("./public/background-full.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .figure {
      position: absolute;
      left: 41.5%;
      bottom: -3.5%;
      height: 68vh;
      width: auto;
      z-index: 2;

      transform: translateX(-50%);
      transform-origin: bottom center;
    }

    .foot-shadow {
      position: absolute;
      left: 38.5%;
      bottom: 0.5%;

      width: 190px;
      height: 18px;

      background: rgba(0, 0, 0, 0.72);
      border-radius: 50%;
      filter: blur(9px);

      transform: rotate(-5deg);
      transform-origin: right center;

      z-index: 1;
      pointer-events: none;
    }

    .starlight-wash {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;

      opacity: 0;

      background:
        radial-gradient(
          ellipse 18% 30% at 42% 54%,
          rgba(225, 238, 255, 0.18),
          rgba(180, 215, 255, 0.10) 38%,
          transparent 72%
        );

      mix-blend-mode: screen;
      filter: blur(10px);
      transition: opacity 800ms ease;
    }

    .landing.constellation-active .starlight-wash {
      opacity: 1;
    }
  </style>

  <link rel="stylesheet" href="./css/ambient-stars.css" />
  <link rel="stylesheet" href="./css/constellation-interaction.css" />
</head>

<body>
  <main class="landing">
    <div class="constellation-dim"></div>
    <div class="starlight-wash"></div>
    <div class="foot-shadow"></div>

    <img
      class="figure"
      src="./public/nam-standing.png"
      alt="Nam standing on the balcony"
    />
  </main>

  <script src="./js/portfolio-stars.js"></script>
  <script src="./js/static-star-labels.js"></script>
  <script src="./js/constellation-interaction.js"></script>
  <script src="./js/ambient-stars.js"></script>
</body>
</html>
