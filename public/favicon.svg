<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#d9f3ff"/>
      <stop offset="0.5" stop-color="#72bfff"/>
      <stop offset="1" stop-color="#2869d0" stop-opacity="0"/>
    </radialGradient>

    <filter id="radiance" x="-100%" y="-100%" width="300%" height="300%">
